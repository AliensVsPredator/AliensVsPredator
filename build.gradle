plugins {
	// see https://fabricmc.net/develop/ for new versions
	id 'fabric-loom' version '1.8-SNAPSHOT' apply false
	// see https://projects.neoforged.net/neoforged/moddevgradle for new versions
	id 'net.neoforged.moddev' version '2.0.49-beta' apply false

	// Manual plugins added here
	id 'java'
	id "me.modmuss50.mod-publish-plugin" version "0.8.4"
	id 'org.moddedmc.wiki.toolkit' version '0.2.5'
}

// TODO: Figure out if this is still processing resources correctly.
processResources {
	from("$rootDir/docs/avp/") {
		into "assets/avp/books/avp/"
		exclude '.assets/item/**'
	}

	doLast {
		println "processResources executed: wiki folder copied into assets/avp"
	}
}

// TODO: Wiki preview is broken when ran from Intellij's gradle panel, use ./gradlew ... commands to run tasks, instead.
wiki {
	if (project.rootDir.toPath().resolve("key.properties").toFile().exists()) {
		def releaseProp = new Properties()
		File secretPropsFile = file("key.properties")
		releaseProp.load(secretPropsFile.newInputStream())
		wikiAccessToken = releaseProp.getProperty("wikiKey")
	}
	docs {
		avp {
			root = file('docs/avp')
			exportedAssetNamespaces = ['avp']
		}
	}
}