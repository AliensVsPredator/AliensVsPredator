import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'fabric-loom' version '1.10.1'
	id 'maven-publish'
	id 'com.diffplug.spotless'
	id 'com.github.ben-manes.versions'
	id 'idea'
	id "me.modmuss50.mod-publish-plugin" version "0.8.4"
	id 'org.moddedmc.wiki.toolkit' version '0.2.5'
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
	maven { url = "https://jitpack.io" }
	maven { url = "https://maven.azuredoom.com/mods" }
	// Needed for Fabric only at the moment
	maven { url = "https://maven.terraformersmc.com/releases" }
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.shedaniel.me" }
	maven { url = "https://maven.blamejared.com/" }
	maven { url = "https://modmaven.dev" }
}

loom {
	def aw = file("src/main/resources/avp.accesswidener")

	if (aw.exists()) {
		accessWidenerPath.set(aw)
	}
	mods {
		"avp" {
			sourceSet sourceSets.main
		}
	}

}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation 'com.github.bvanseg:just:-SNAPSHOT'

	modImplementation "mod.azure.azurelib:azurelib-fabric-${project.minecraft_version}:${project.azurelib_version}"

	modApi "com.terraformersmc:modmenu:${project.modmenu_version}"

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

	modApi "dev.architectury:architectury-fabric:${project.architectury_version}"
	modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"

	modRuntimeOnly "org.sinytra:item-asset-export-fabric:${project.asset_export}"

	modCompileOnlyApi("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}")
	modRuntimeOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")
}

processResources {
	def expandProps = [
		"version": version,
		"mod_name": mod_name,
		"mod_description": mod_description,
		"mod_license": mod_license,
		"mod_icon": mod_icon
	]

	filesMatching("fabric.mod.json") {
		expand expandProps
	}
	inputs.properties(expandProps)

	from("$rootDir/docs/avp/") {
		into "assets/avp/books/avp/"
		exclude '.assets/item/**'
	}

	doLast {
		def jsonMinifyStart = System.currentTimeMillis()
		def jsonMinified = 0
		def jsonBytesSaved = 0
		fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
			File file = it
			jsonMinified++
			def oldLength = file.length()
			file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
			jsonBytesSaved += oldLength - file.length()
		}
		println('Minified ' + jsonMinified + ' json files. Saved ' + jsonBytesSaved + ' bytes. Took ' + (System.currentTimeMillis() - jsonMinifyStart) + 'ms.')
		println "processResources executed: wiki folder copied into assets/avp"
	}
}

spotless {
	java {
		eclipse().configFile("$rootDir/eclipse-formatter.xml")
		endWithNewline()
		importOrder("", "java", group.toString(), "\\#")
		leadingTabsToSpaces(4)
		removeUnusedImports()
		trimTrailingWhitespace()
	}
}

tasks.build {
	dependsOn("spotlessApply")
}

tasks.named("dependencyUpdates").configure {
	filterConfigurations {
		it.name.equals("modImplementation")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

if (file('key.properties').exists()) {
	publishMods {
		def releaseProp = new Properties()
		File secretPropsFile = file("key.properties")
		releaseProp.load(secretPropsFile.newInputStream())
		file = jar.archiveFile
		changelog = rootProject.file("CHANGELOG.md").text
		type = STABLE
		modLoaders.add("fabric")

		curseforge {
			projectId = project.cf_id
			projectSlug = project.cf_project_slug
			accessToken = releaseProp.getProperty("curseKey")
			minecraftVersions.add(project.minecraft_version)
			requires {
				slug = "fabric-api"
			}
			requires {
				slug = "azurelib"
			}
		}
		modrinth {
			projectId = project.modrinth_id
			accessToken = releaseProp.getProperty('modrinthKey')
			minecraftVersions.add(project.minecraft_version)
			requires {
				slug = "fabric-api"
			}
			requires {
				slug = "azurelib"
			}
		}
	}
}

wiki {
	if (file('key.properties').exists()) {
		def releaseProp = new Properties()
		File secretPropsFile = file("key.properties")
		releaseProp.load(secretPropsFile.newInputStream())
		wikiAccessToken = releaseProp.getProperty("wikiKey")
	}
	docs {
		avp {
			root = file('docs/avp')
			exportedAssetNamespaces = ['avp']
		}
	}
}