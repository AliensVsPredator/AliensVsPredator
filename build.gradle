import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'fabric-loom' version '1.10.1'
	id 'maven-publish'
	id 'com.diffplug.spotless'
	id 'com.github.ben-manes.versions'
	id 'idea'
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// The Maven with the mods source
	maven { url 'https://maven.azuredoom.com/mods' }
	// Needed for Fabric only at the moment
	maven { url "https://maven.terraformersmc.com/releases" }
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.shedaniel.me" }
}

loom {
	def aw = file("src/main/resources/avp.accesswidener")

	if (aw.exists()) {
		accessWidenerPath.set(aw)
	}
	mods {
		"avp" {
			sourceSet sourceSets.main
		}
	}

}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "mod.azure.azurelib:azurelib-fabric-${project.minecraft_version}:${project.azurelib_version}"

	modApi "com.terraformersmc:modmenu:${project.modmenu_version}"

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

	modApi "dev.architectury:architectury-fabric:${project.architectury_version}"
	modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	doLast {
		def jsonMinifyStart = System.currentTimeMillis()
		def jsonMinified = 0
		def jsonBytesSaved = 0
		fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
			File file = it
			jsonMinified++
			def oldLength = file.length()
			file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
			jsonBytesSaved += oldLength - file.length()
		}
		println('Minified ' + jsonMinified + ' json files. Saved ' + jsonBytesSaved + ' bytes. Took ' + (System.currentTimeMillis() - jsonMinifyStart) + 'ms.')
	}
}

spotless {
	java {
		eclipse().configFile("$rootDir/eclipse-formatter.xml")
		endWithNewline()
		importOrder("", "java", group.toString(), "\\#")
		leadingTabsToSpaces(4)
		removeUnusedImports()
		trimTrailingWhitespace()
	}
}

tasks.build {
	dependsOn("spotlessApply")
}

tasks.named("dependencyUpdates").configure {
	filterConfigurations {
		it.name.equals("modImplementation")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
	}
}