plugins {
    id 'com.diffplug.spotless'
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
    id 'org.moddedmc.wiki.toolkit'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            jvmArgument "-Dterminal.ansi=true"
        }

        client {
            client()
            gameDirectory = project.file('runs/client')
        }

        data {
            data()
            // Currently keeps the generated files in NeoForge sub project, maybe move?
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('../common/src/main/generated/').getAbsolutePath(), '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "mod.azure.azurelib:azurelib-neo-${project.minecraft_version}:${project.azurelib_version}"

    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"

    implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_version}"

    compileOnly "org.sinytra:item-asset-export-neoforge:${project.asset_export}"

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${project.jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${project.jei_version}")

    jarJar(implementation("com.github.bvanseg:just:${project.just_version}"))
    additionalRuntimeClasspath "com.github.bvanseg:just:${project.just_version}"
}


def keyPropsFile = new File(rootProject.projectDir, "key.properties")
if (keyPropsFile.exists()) {
    publishMods {
        def releaseProp = new Properties()
        releaseProp.load(new FileInputStream(keyPropsFile))

        //Settings
        changelog = new File(rootProject.projectDir, "CHANGELOG.md").text
        type = STABLE
        file = jar.archiveFile
        modLoaders.add("neoforge")
        dryRun = false

        discord {
            webhookUrl = releaseProp.getProperty("discordKey")
            dryRunWebhookUrl = releaseProp.getProperty("discordKey")
            username = "MU/TH/UR"
            avatarUrl = "https://i.imgur.com/5Y0EZ9x.jpeg"
            content = changelog.map { text ->
                def maxEmbedCharacterCount = 4096
                def header = "# A new version of AVP for NeoForge has been released!\n"
                def footer = "\n...and more! Check the mod page for more details."

                def needsTruncation = (header.length() + text.length()) > maxEmbedCharacterCount
                def maxContentLength = maxEmbedCharacterCount - header.length() - (needsTruncation ? footer.length() : 0)

                def truncatedText = text

                if (needsTruncation) {
                    if (text.length() > maxContentLength) {
                        // First, take up to maxContentLength.
                        def candidate = text.take(maxContentLength)
                        // Then find the last newline before the cut.
                        def lastNewline = candidate.lastIndexOf('\n')
                        if (lastNewline != -1) {
                            candidate = candidate.take(lastNewline)
                        }
                        truncatedText = candidate
                    }
                }

                header + truncatedText + (needsTruncation ? footer : "")
            }

            setPlatforms(publishMods.platforms.curseforge, publishMods.platforms.modrinth)

            style {
                look = "MODERN"
                thumbnailUrl = "https://cdn.modrinth.com/data/Uqo0H9FX/8ffabe2f364c34e6b0f13019664c5fe4989c2f95_96.webp"
            }
        }

        curseforge {
            projectId = project.cf_id
            projectSlug = project.cf_project_slug
            accessToken = releaseProp.getProperty("curseKey")
            minecraftVersions.add(project.minecraft_version)
            announcementTitle = "Download from CurseForge"
            javaVersions.add(JavaVersion.VERSION_21)
            clientRequired = true
            serverRequired = true
            requires {
                slug = "azurelib"
            }
        }

        modrinth {
            projectId = project.modrinth_id
            accessToken = releaseProp.getProperty('modrinthKey')
            minecraftVersions.add(project.minecraft_version)
            announcementTitle = "Download from Modrinth"
            requires {
                slug = "azurelib"
            }
        }
    }
}