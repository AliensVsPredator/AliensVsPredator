//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'com.diffplug.spotless'
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

// create a runtime-only configuration that published to POM
configurations {
    localRuntime {
        canBeConsumed = false
        visible = false
    }

    named(sourceSets.main.runtimeClasspathConfigurationName) {
        extendsFrom(configurations.localRuntime)
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            jvmArgument "-Dterminal.ansi=true"
        }

        client {
            client()
            gameDirectory = project.file('runs/client')
        }

        data {
            data()
            // Currently keeps the generated files in NeoForge sub project, maybe move?
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('../common/src/main/generated/').getAbsolutePath(), '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    jarJar(implementation("com.just:just-codec:${project.just_codec_version}"))
    additionalRuntimeClasspath "com.just:just-codec:${project.just_codec_version}"

    jarJar(implementation("com.just:just-core:${project.just_core_version}"))
    additionalRuntimeClasspath "com.just:just-core:${project.just_core_version}"

    jarJar(implementation("com.just:just-goap:${project.just_goap_version}"))
    additionalRuntimeClasspath "com.just:just-goap:${project.just_goap_version}"

    compileOnly "maven.modrinth:shoulder-surfing-reloaded:1.21.1-4.14.3+neoforge"

    localRuntime "dev.architectury:architectury-neoforge:${project.architectury_version}"
    localRuntime "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_version}"

    // Thanks to Rearth from Oritech for this little trick. :)
    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "emi": localRuntime "dev.emi:emi-neoforge:${emi_version}"; break
        case "jei": localRuntime "mezz.jei:jei-$minecraft_version-neoforge:${jei_version}"; break
        case "rei": localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"; break
        case "disabled": break
        default: println("Unknown recipe viewer specified: $recipe_viewer. Must be EMI, REI, JEI, or disabled.")
    }
}

configurations.configureEach {
    resolutionStrategy {
        force "org.slf4j:slf4j-api:${project.slf4j_version}"

        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.slf4j' && details.requested.name == 'slf4j-api') {
                details.useVersion project.slf4j_version
                details.because 'Aligning SLF4J version to satisfy NeoForge strict constraint'
            }
            if (details.requested.group == 'ch.qos.logback' && details.requested.name == 'logback-classic') {
                details.useVersion project.logback_classic_version
                details.because 'Logback 1.5.x requires slf4j-api 2.0.17+, incompatible with NeoForge'
            }
        }
    }
}

def keyPropsFile = new File(rootProject.projectDir, "key.properties")

if (keyPropsFile.exists()) {
    publishMods {
        def releaseProp = new Properties()
        releaseProp.load(new FileInputStream(keyPropsFile))

        //Settings
        changelog = new File(rootProject.projectDir, "CHANGELOG.md").text
        type = STABLE
        file = jar.archiveFile
        modLoaders.add("neoforge")
        dryRun = Boolean.valueOf(project.dry_run)
        def discordPublishWebhookUrl = dryRun.get()
            ? releaseProp.getProperty("discordDryRunPublishWebhookUrl")
            : releaseProp.getProperty("discordPublishWebhookUrl")

        discord {
            webhookUrl = discordPublishWebhookUrl
            dryRunWebhookUrl = discordPublishWebhookUrl
            username = "MU/TH/UR"
            avatarUrl = "https://i.imgur.com/5Y0EZ9x.jpeg"
            content = changelog.map { text ->
                def maxEmbedCharacterCount = 4096
                def header = "# A new version of ${project.mod_name} for NeoForge has been released!\n"
                def footer = "\n...and more! Check the mod page for more details."

                def needsTruncation = (header.length() + text.length()) > maxEmbedCharacterCount
                def maxContentLength = maxEmbedCharacterCount - header.length() - (needsTruncation ? footer.length() : 0)

                def truncatedText = text

                if (needsTruncation) {
                    if (text.length() > maxContentLength) {
                        // First, take up to maxContentLength.
                        def candidate = text.take(maxContentLength)
                        // Then find the last newline before the cut.
                        def lastNewline = candidate.lastIndexOf('\n')
                        if (lastNewline != -1) {
                            candidate = candidate.take(lastNewline)
                        }
                        truncatedText = candidate
                    }
                }

                header + truncatedText + (needsTruncation ? footer : "")
            }

            setPlatforms(publishMods.platforms.curseforge, publishMods.platforms.modrinth)

            style {
                look = "MODERN"
                thumbnailUrl = "https://cdn.modrinth.com/data/Uqo0H9FX/8ffabe2f364c34e6b0f13019664c5fe4989c2f95_96.webp"
            }
        }

        curseforge {
            projectId = project.cf_id
            projectSlug = project.cf_project_slug
            accessToken = releaseProp.getProperty("curseKey")
            minecraftVersions.add(project.minecraft_version)
            announcementTitle = "Download from CurseForge"
            javaVersions.add(JavaVersion.VERSION_21)
            clientRequired = true
            serverRequired = true
            requires {
                slug = "azurelib"
            }
        }

        modrinth {
            projectId = project.modrinth_id
            accessToken = releaseProp.getProperty('modrinthKey')
            minecraftVersions.add(project.minecraft_version)
            announcementTitle = "Download from Modrinth"
            requires {
                slug = "azurelib"
            }
        }
    }
}