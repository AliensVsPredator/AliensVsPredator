name: AVP Jar Build Testing

on:
  workflow_dispatch:
#  pull_request:
#  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run Datagen for NeoForge and then Fabric
        run: ./gradlew runAllDatagen
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload a Fabric Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric
          path: |
            fabric/build/libs/*.jar
      - name: Upload a NeoForge Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoForge
          path: |
            neoforge/build/libs/*.jar