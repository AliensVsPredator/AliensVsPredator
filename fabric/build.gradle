plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'com.diffplug.spotless'
    id 'com.github.ben-manes.versions'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin'
    id 'org.moddedmc.wiki.toolkit'
}

fabricApi {
    configureDataGeneration()
}

// ##################################################################################
// # Runs data gen using Fabric and moves generated resources to common.            #
// ##################################################################################
tasks.named('runDatagen') {
    doLast {
        def generatedDir = new File(project.projectDir, 'src/main/generated')
        def targetDir = new File(rootProject.projectDir, 'common/src/main/generated')

        println "Checking generatedDir: ${generatedDir.absolutePath}"

        if (generatedDir.exists()) {
            targetDir.mkdirs()

            // Copy files to the common module.
            ant.copy(todir: targetDir) {
                fileset(dir: generatedDir)
            }

            println "Copied generated data to: ${targetDir}"

            // Delete the original generated directory.
            if (generatedDir.deleteDir()) {
                println "Deleted original generated directory: ${generatedDir}"
            } else {
                println "Failed to delete: ${generatedDir} — possibly contains files still in use"
            }
        } else {
            println "No generated data found at: ${generatedDir}"
        }
    }
}
// END

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Manually added dependencies
    // TODO: Shouldn't need this implementation call, figure out how to remove.
    implementation "com.github.bvanseg:just:${project.just_version}"
    include "com.github.bvanseg:just:${project.just_version}"

    modImplementation "mod.azure.azurelib:azurelib-fabric-${project.minecraft_version}:${project.azurelib_version}"

    modApi "com.terraformersmc:modmenu:${project.modmenu_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    modApi "dev.architectury:architectury-fabric:${project.architectury_version}"
    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"

    modRuntimeOnly "org.sinytra:item-asset-export-fabric:${project.asset_export}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def keyPropsFile = new File(rootProject.projectDir, "key.properties")
if (keyPropsFile.exists()) {
    publishMods {
        def releaseProp = new Properties()
        releaseProp.load(new FileInputStream(keyPropsFile))

        //Settings
        changelog = new File(rootProject.projectDir, "CHANGELOG.md").text
        type = STABLE
        file = remapJar.archiveFile
        modLoaders.add("fabric")
        dryRun = false

        discord {
            webhookUrl = releaseProp.getProperty("discordKey")
            dryRunWebhookUrl = releaseProp.getProperty("discordKey")
            username = "MU/TH/UR"
            avatarUrl = "https://i.imgur.com/5Y0EZ9x.jpeg"
            content = changelog.map { text ->
                def maxEmbedCharacterCount = 4096
                def header = "# A new version of AVP for Fabric has been released!\n"
                def footer = "\n...and more! Check the mod page for more details."

                def needsTruncation = (header.length() + text.length()) > maxEmbedCharacterCount
                def maxContentLength = maxEmbedCharacterCount - header.length() - (needsTruncation ? footer.length() : 0)

                def truncatedText = text

                if (needsTruncation) {
                    if (text.length() > maxContentLength) {
                        // First, take up to maxContentLength.
                        def candidate = text.take(maxContentLength)
                        // Then find the last newline before the cut.
                        def lastNewline = candidate.lastIndexOf('\n')
                        if (lastNewline != -1) {
                            candidate = candidate.take(lastNewline)
                        }
                        truncatedText = candidate
                    }
                }

                header + truncatedText + (needsTruncation ? footer : "")
            }

            setPlatforms(publishMods.platforms.curseforge, publishMods.platforms.modrinth)

            style {
                look = "MODERN"
                thumbnailUrl = "https://cdn.modrinth.com/data/Uqo0H9FX/8ffabe2f364c34e6b0f13019664c5fe4989c2f95_96.webp"
            }
        }

        curseforge {
            projectId = project.cf_id
            projectSlug = project.cf_project_slug
            accessToken = releaseProp.getProperty("curseKey")
            minecraftVersions.add(project.minecraft_version)
            announcementTitle = "Download from CurseForge"
            javaVersions.add(JavaVersion.VERSION_21)
            clientRequired = true
            serverRequired = true
            requires {
                slug = "fabric-api"
            }
            requires {
                slug = "azurelib"
            }
        }

        modrinth {
            projectId = project.modrinth_id
            accessToken = releaseProp.getProperty("modrinthKey")
            minecraftVersions.add(project.minecraft_version)
            announcementTitle = "Download from Modrinth"
            requires {
                slug = "fabric-api"
            }
            requires {
                slug = "azurelib"
            }
        }
    }
}